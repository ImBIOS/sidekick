services:
  control-plane:
    build: ./control-plane
    ports: ["8080:8080"]
    environment:
      DATABASE_URL: postgres://sidekick:sidekick@postgres:5432/sidekick
      S3_ENDPOINT: http://minio:9000
      # Agent auth: either verify hosted sk_live_* keys via web, or use
      # static org:key pairs (self-host without the web console).
      # SIDEKICK_AUTH_URL: http://web:8000
      # CONTROL_PLANE_SECRET: ${CONTROL_PLANE_SECRET}
      SIDEKICK_API_KEYS: ${SIDEKICK_API_KEYS:-}
      # Fleet auth: daemons present this bearer token on /v1/host/*.
      # Generate once: openssl rand -hex 32. Same value goes into
      # `sidekick host join --token` on every fleet Mac / Linux host.
      SIDEKICK_HOST_TOKEN: ${SIDEKICK_HOST_TOKEN:-}
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: sidekick
      POSTGRES_PASSWORD: sidekick
    volumes: [pgdata:/var/lib/postgresql/data]
  minio:
    image: minio/minio
    command: server /data
    ports: ["9000:9000"]
  # Linux KVM fleet for Android (needs /dev/kvm on host). One container runs
  # emu-host, which boots AVDs per claimed emu (bake AVDs into the image or
  # mount them; default profile Pixel_7_API_34).
  emulator:
    build:
      context: .
      dockerfile: ./deploy/emulator.Dockerfile
    device_cgroup_rules: ["c 10:232 rmw"] # /dev/kvm
    privileged: true
    # Agents reach adb through the target emu-host reports. Publish the
    # emulator's adb port and set EMU_ADB_ADDR to this machine's LAN IP
    # (agents are usually remote; a docker-internal IP won't dial).
    ports: ["5555:5555"]
    environment:
      SIDEKICK_CONTROL: http://control-plane:8080
      SIDEKICK_HOST_TOKEN: ${SIDEKICK_HOST_TOKEN:-}
      SIDEKICK_POOL: linux-pool
      EMU_ADB_ADDR: ${EMU_ADB_ADDR:-}
  # Mac fleet is BYO: run build-daemon + sim-daemon on each Mac mini:
  #   sidekick host join --control https://api.your-host.com --token $HOST_TOKEN
volumes:
  pgdata:
