# Android end-to-end: the whole Sidekick loop on a real emulator.
# Everything service-like runs INSIDE the emulator-runner script step:
# GitHub does not guarantee background processes survive across steps, so
# the control-plane, emu-host, and all verbs live in one shell sequence.
# Green here is the witness behind the comparison-table Yes cells for
# recording, replay, visual diff and network capture.
name: android-e2e
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "control-plane/**"
      - "emu-host/**"
      - "testrun/**"
      - "cmd/**"
      - "internal/**"
      - "skill/**"
      - ".github/workflows/android-e2e.yml"
      - "go.mod"
      - "go.sum"

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build Go binaries
        run: |
          set -eu
          mkdir -p $GITHUB_WORKSPACE/bin
          go build -o $GITHUB_WORKSPACE/bin/sidekick ./cmd/sidekick
          go build -o $GITHUB_WORKSPACE/bin/emu-host ./emu-host
          go build -o $GITHUB_WORKSPACE/bin/control-plane ./control-plane
          ls -la $GITHUB_WORKSPACE/bin/

      - name: Require KVM
        # Software-emulated Android (no /dev/kvm) boots in ~16min with a
        # wedged accessibility stack and starves the host until the OOM
        # killer takes our own shell (exit 137). Fail in seconds instead.
        run: |
          test -c /dev/kvm || { echo "NO KVM on this runner - re-run for a nested-virt host"; exit 1; }
          echo "KVM present"

      - name: Full loop on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 3072 -skin 768x1280 -no-metrics
          script: bash $GITHUB_WORKSPACE/scripts/android-e2e.sh
