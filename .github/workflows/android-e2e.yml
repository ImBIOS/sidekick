# Android end-to-end: the whole Sidekick loop on a real emulator.
# The emulator-runner boots a KVM Android; emu-host --adopt attaches to the
# already-booted instance (no double boot), provisions it in the
# control-plane, and the agent verbs (tree, tap replay, screenshot, record,
# logs, netcap, rotate) run exactly as `skill/SKILL.md` prescribes. Green
# here is the witness behind the comparison-table Yes cells for recording,
# replay, visual diff and network capture.
name: android-e2e
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "control-plane/**"
      - "emu-host/**"
      - "testrun/**"
      - "cmd/**"
      - "internal/**"
      - "skill/**"
      - ".github/workflows/android-e2e.yml"
      - "go.mod"
      - "go.sum"

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Start control-plane and build binaries
        env:
          PORT: "8080"
          SIDEKICK_API_KEYS: "org_ci:ci-key"
          SIDEKICK_HOST_TOKEN: ci-host
        run: |
          set -eu
          go version
          go run ./control-plane > /tmp/cp.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf -H "Authorization: Bearer ci-key" http://localhost:8080/v1/whoami && break
            sleep 2
          done
          curl -sf -H "Authorization: Bearer ci-key" http://localhost:8080/v1/whoami
          mkdir -p $GITHUB_WORKSPACE/bin
          go build -o $GITHUB_WORKSPACE/bin/sidekick ./cmd/sidekick
          go build -o $GITHUB_WORKSPACE/bin/emu-host ./emu-host
          ls -la $GITHUB_WORKSPACE/bin/sidekick $GITHUB_WORKSPACE/bin/emu-host

      - name: Create emulator resource
        env:
          SIDEKICK_URL: http://localhost:8080
          SIDEKICK_TOKEN: ci-key
        run: |
          set -eu
          echo "whoami=$(whoami) tmp=$(df /tmp | tail -1)"; ls -la $GITHUB_WORKSPACE/bin/sidekick $GITHUB_WORKSPACE/bin/emu-host || true
          mount | grep -E " /tmp " || echo "no tmp mount"
          test -x $GITHUB_WORKSPACE/bin/sidekick || { echo "sidekick binary missing"; exit 1; }
          CREATE_OUT=$($GITHUB_WORKSPACE/bin/sidekick android create --profile Pixel_7_API_34)
          echo "$CREATE_OUT"
          EID=$(printf '%s' "$CREATE_OUT" | python3 -c "import json,sys; print(json.JSONDecoder().raw_decode(sys.stdin.read())[0]['id'])")
          test -n "$EID"
          echo "EID=$EID" >> "$GITHUB_ENV"

      - name: Full loop on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          script: |
            set -eu
            export SIDEKICK_URL=http://localhost:8080 SIDEKICK_TOKEN=ci-key
            SIDEKICK_POOL=linux-pool EMU_ADB_ADDR=127.0.0.1 $GITHUB_WORKSPACE/bin/emu-host --control http://localhost:8080 --token ci-host --adopt --interval 10s > $GITHUB_WORKSPACE/bin/emu-host.log 2>&1 &
            for i in $(seq 1 60); do STATUS=$($GITHUB_WORKSPACE/bin/sidekick android get "$EID" | python3 -c "import json,sys; print(json.load(sys.stdin)['status'])"); echo "emu status: $STATUS"; if [ "$STATUS" = "running" ]; then break; fi; sleep 10; done
            [ "$STATUS" = "running" ]
            $GITHUB_WORKSPACE/bin/sidekick android ui-tree "$EID" | tee tree.json
            grep -q "@e" tree.json
            $GITHUB_WORKSPACE/bin/sidekick android screenshot "$EID" --out shot.png
            test -s shot.png
            $GITHUB_WORKSPACE/bin/sidekick android logs "$EID" --tail 5 | tee logs.txt
            test -s logs.txt
            $GITHUB_WORKSPACE/bin/sidekick android record "$EID" --out demo.mp4 --duration 20
            test -s demo.mp4
            $GITHUB_WORKSPACE/bin/sidekick android netcap --out cap.pcap --duration 15 --adb-serial emulator-5554
            test -s cap.pcap
            $GITHUB_WORKSPACE/bin/sidekick android rotate "$EID" 90 --adb-serial emulator-5554
            $GITHUB_WORKSPACE/bin/sidekick android rotate "$EID" 0 --adb-serial emulator-5554
            REF=$(python3 -c "import json; d=json.load(open('tree.json')); print(d['nodes'][0]['children'][0]['ref'] if d['nodes'][0].get('children') else d['nodes'][0]['ref'])")
            echo "tapping $REF"
            $GITHUB_WORKSPACE/bin/sidekick test record --out t.json tap "$REF"
            $GITHUB_WORKSPACE/bin/sidekick test replay --in t.json --emu "$EID" --adb-serial emulator-5554 --threshold 0.5
            $GITHUB_WORKSPACE/bin/sidekick test diff shot.png shot.png --threshold 0.01
            $GITHUB_WORKSPACE/bin/sidekick android delete "$EID"
            echo "--- emu-host log ---"; tail -20 $GITHUB_WORKSPACE/bin/emu-host.log || true
