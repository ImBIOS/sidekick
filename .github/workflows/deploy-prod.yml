# Production deploy: build on prod-0, update the swarm services.
#
# prod-0 is a single-node ARM64 swarm running sidekick-web (:3000) +
# sidekick-api (:3080) fronted by cloudflared. Deploys build natively on
# prod-0 over Tailscale SSH and update services with local images — no
# registry round-trip (docker login against registry:3 401s valid
# credentials from CI runners; local logins are unaffected, but nothing
# here needs the registry at all).
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   PROD_SSH_KEY       – private ed25519 key; public half lives in prod-0 ubuntu authorized_keys
#   TAILSCALE_AUTHKEY  – reusable auth key (admin console -> Settings -> Keys)
name: deploy-prod
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy-prod.yml"
  workflow_dispatch:

env:
  PROD_HOST: 100.114.228.72
  PROD_USER: ubuntu
  PROD_REPO: /home/ubuntu/sidekick

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Connect Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          args: --accept-dns=false

      - name: Build and rolling update on prod-0
        run: |
          set -eu
          mkdir -p ~/.ssh
          printf '%s\n' "$PROD_SSH_KEY" > ~/.ssh/prod_deploy
          chmod 600 ~/.ssh/prod_deploy
          SSH="ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -i ~/.ssh/prod_deploy ${PROD_USER}@${PROD_HOST}"
          $SSH "test -d $PROD_REPO/.git || git clone https://github.com/ImBIOS/sidekick $PROD_REPO"
          $SSH "cd $PROD_REPO && git fetch origin && git checkout main && git reset --hard origin/main && git rev-parse --short HEAD"
          $SSH "cd $PROD_REPO && docker build -f web/Dockerfile --build-arg VITE_SERVER_URL=https://sidekick.imbios.dev -t sidekick-web:${GITHUB_SHA} ."
          $SSH "cd $PROD_REPO && docker build -f web/Dockerfile.api -t sidekick-api:${GITHUB_SHA} ."
          $SSH "docker service update --image sidekick-web:${GITHUB_SHA} sidekick-web && docker service update --image sidekick-api:${GITHUB_SHA} sidekick-api"
          for svc in sidekick-web sidekick-api; do
            for i in $(seq 1 30); do
              running=$($SSH "docker service ps --format '{{.CurrentState}} {{.Image}}' $svc 2>/dev/null" | grep -c "Running.*${GITHUB_SHA:0:12}" || true)
              [ "$running" -ge 1 ] && break
              sleep 10
            done
          done
          curl -fsS --max-time 30 https://sidekick.imbios.dev/login | grep -q "Log in — Sidekick"
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}

      - name: Roll back on failure
        if: failure()
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$PROD_SSH_KEY" > ~/.ssh/prod_deploy
          chmod 600 ~/.ssh/prod_deploy
          SSH="ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -i ~/.ssh/prod_deploy ${PROD_USER}@${PROD_HOST}"
          $SSH 'docker service update --rollback sidekick-web; docker service update --rollback sidekick-api'
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
