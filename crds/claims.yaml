#
# Sidekick claim CRDs. Apply once per cluster, then let teams provision
# capacity declaratively:
#
#   kubectl apply -f crds/claims.yaml
#   kubectl apply -f team-a-sims.yaml   # kind: SimulatorClaim
#
# The controller (cmd/controller) reconciles each claim against the
# control-plane: it creates the resource, mirrors state into .status, and
# enforces spec.ttl (default 2h) by releasing the resource on expiry.
# Claim lifecycle: Pending -> Provisioning -> Running -> Succeeded/Failed,
# or Expired when the TTL fires. Terminal claims are never resurrected:
# delete and re-apply to recreate.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: simulatorclaims.sidekick.imbios.dev
spec:
  group: sidekick.imbios.dev
  names:
    kind: SimulatorClaim
    listKind: SimulatorClaimList
    plural: simulatorclaims
    singular: simulatorclaim
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Host
          type: string
          jsonPath: .status.host
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [device, tenant]
              properties:
                device: { type: string, description: "Simulator device, e.g. iPhone16" }
                os: { type: string, description: "Runtime, e.g. 18.2 (default: latest)" }
                region: { type: string, description: "Fleet region pin (default: any)" }
                tenant: { type: string, description: "Owning tenant, e.g. tn_123" }
                ttl: { type: string, description: "Lifetime like 30m (default: 2h)" }
            status:
              type: object
              properties:
                phase: { type: string }
                resourceID: { type: string }
                host: { type: string }
                udid: { type: string }
                webrtcURL: { type: string }
                message: { type: string }
                expiresAt: { type: string, format: date-time }
---
